# Conservative defaults. Strategy/risk/paper knobs are shared across venues.

dry_run: true
# Production trading is never implemented. True makes the process raise.
live_trading_enabled: false

# Primary venue for scan/paper. polymarket_us remains available via --exchange.
exchange: kalshi

api:
  gateway_base_url: https://gateway.polymarket.us
  api_base_url: https://api.polymarket.us
  request_timeout_seconds: 30
  max_retries: 2
  min_request_interval_seconds: 0.12

kalshi:
  # Public production market data (no keys). Orders are never sent here.
  market_data_base_url: https://external-api.kalshi.com/trade-api/v2
  demo_base_url: https://external-api.demo.kalshi.co/trade-api/v2
  demo_orders_enabled: false
  # Basic tier: 200 read tokens/s, 10 tokens/GET => 20 GET/s. Stay below it.
  min_request_interval_seconds: 0.08
  tick_size: 0.01

scanner:
  active_only: true
  include_closed: false
  max_markets_to_list: 40
  max_book_fetches: 20
  min_volume_shares: 0
  min_bid_depth_contracts: 20
  min_ask_depth_contracts: 20
  max_spread: 0.05
  min_hours_to_resolution: 1
  top_n: 12

paper:
  starting_cash: 1000.00
  quote_size_contracts: 10
  max_markets: 5
  ticks: 6
  poll_interval_seconds: 2.0
  tick_size_fallback: 0.01
  maker:
    enabled: true
    half_spread: 0.02
    inventory_skew_per_contract: 0.0004
  near_resolution:
    enabled: true
    min_price: 0.94
    max_price: 0.98
    max_hours_to_resolution: 36
    min_hours_to_resolution: 0.5
    quote_size_contracts: 5
  risk:
    max_position_per_market: 40
    max_gross_position: 120
    max_daily_loss: 25.00
    cancel_on_price_jump: 0.08
    maker_min_hours_to_resolution: 6
  fills:
    require_strict_trade_through: true

compare:
  max_markets_each: 30
  min_title_score: 0.34
  min_net_edge: 0.01
  contract_size: 100

logging:
  level: INFO
  jsonl_path: logs/decisions.jsonl
  report_path: logs/paper_report.txt
  state_path: logs/paper_state.json
