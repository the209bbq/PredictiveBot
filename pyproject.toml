[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-bot"
version = "0.1.0"
description = "Dry-run Kalshi scanner and paper bot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "polymarket-us>=1.0.2",
  "httpx>=0.27.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.0",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pmbot = "polymarket_bot.cli:main"

[tool.setuptools.packages.find]
include = ["polymarket_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
